name: Build MenaAI iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Check iOS project
        run: |
          echo "Repository:"
          pwd
          echo ""
          echo "Files:"
          ls -la
          echo ""
          echo "iOS folder:"
          ls -la ios
          echo ""
          echo "Xcode projects:"
          find ios -name "*.xcodeproj" -maxdepth 3

      - name: Build MenaAI
        run: |
          xcodebuild \
            -project ios/MenaAI.xcodeproj \
            -scheme MenaAI \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Check build
        run: |
          echo "Build products:"
          find build -name "*.app" -print

      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MenaAI.app Payload/MenaAI.app
          zip -r MenaAI-V1.0.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MenaAI-iOS-V1.0
          path: MenaAI-V1.0.ipa
          retention-days: 30
