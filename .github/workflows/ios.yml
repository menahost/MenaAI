name: Build MenaAI iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Build iOS
        run: |
          xcodebuild \
            -project MenaAI.xcodeproj \
            -scheme MenaAI \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Create IPA folder
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MenaAI.app Payload/
          mkdir -p ipa
          zip -r ipa/MenaAI-V1.0.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MenaAI-iOS-V1.0
          path: ipa/MenaAI-V1.0.ipa
